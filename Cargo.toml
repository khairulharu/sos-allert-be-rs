[package]
name = "sos-allert-be"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "SOS alert backend - Rust port of khairulharu/sos-allert-be (axum + sqlx + redis)"

[lib]
name = "sos_allert"
path = "src/lib.rs"

[[bin]]
name = "web"
path = "src/main.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[dependencies]
anyhow = "1.0.105"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "macros"] }
bcrypt = "0.19.3"
futures = "0.3.34"
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "json", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "timeout", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["v4"] }
validator = { version = "0.20.0", features = ["derive"] }

[dev-dependencies]
bcrypt = "0.19.3"
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"

# The 16G disk cannot hold two debuginfo builds of this tree.
[profile.dev]
debug = 0

[profile.test]
debug = 0
